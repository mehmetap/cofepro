<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoffeeOrder Pro · QR Menü</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#2b201a;background:#f8f4ed}*{box-sizing:border-box}body{margin:0}main{max-width:490px;margin:auto;padding:28px 20px 90px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#896a50;font-weight:800}h1{font-size:45px;line-height:1.03;letter-spacing:-.055em;margin:24px 0 10px}p{color:#8a786b}.tag{background:#e9ded1;border-radius:40px;padding:8px 12px;display:inline-block;font-size:13px}.item{background:white;border:1px solid #e9e0d7;border-radius:22px;padding:18px;margin:12px 0;display:flex;align-items:center;gap:16px}.emoji{font-size:40px;background:#f6eee5;border-radius:18px;padding:14px}.info{flex:1}.info strong{display:block}.info small{color:#867467}.item button,.qty button{border:0;border-radius:14px;background:#3c2b22;color:white;padding:12px 15px;cursor:pointer}section{margin-top:30px}label{display:block;margin:14px 0}input[type=text]{width:100%;padding:15px;border:1px solid #dacdc0;border-radius:12px;font:inherit}input[type=checkbox]{accent-color:#513827}.qty{display:flex;align-items:center;gap:16px}.total{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:750;margin:24px 0}.cta{width:100%;padding:18px;background:#513827;color:white;border:0;border-radius:16px;font-size:16px;font-weight:750;cursor:pointer}#message{white-space:pre-line;background:#e9ded1;border-radius:16px;padding:16px;margin-top:16px;display:none}</style></head><body><main><div class="eyebrow">COFFEEORDER / PRO</div><h1>Güzel kahve.<br>İyi bir mola.</h1><p>Menüden kahveni seç, detayları özelleştir.</p><span class="tag" id="tableLabel"></span><section><div class="eyebrow">01 / KAHVELER</div><div id="products"></div></section><section><div class="eyebrow">02 / SİPARİŞ DETAYI</div><label>Adınız<input id="customer" type="text" maxlength="80" placeholder="Adınızı yazın" autocomplete="name"></label><label><input id="cream" type="checkbox"> Krema +15 ₺</label><label><input id="chocolate" type="checkbox"> Çikolata +20 ₺</label><div class="qty"><button id="minus" aria-label="Adet azalt">−</button><strong id="qty">1</strong><button id="plus" aria-label="Adet artır">+</button></div><div class="total"><span>Toplam</span><span id="total">60 ₺</span></div><button class="cta" id="order">Sipariş özetini göster</button><div id="message" role="status"></div></section></main><script>
const menu=[['Türk Kahvesi',60,'☕'],['Espresso',75,'🫘'],['Latte',100,'🥛'],['Cappuccino',95,'☕'],['Americano',80,'🧊']];
const params=new URLSearchParams(location.search);const raw=params.get('table');const table=raw&&/^\d{1,3}$/.test(raw)&&Number(raw)>0?Number(raw):null;
document.getElementById('tableLabel').textContent=table?'MASA '+table:'DEMO MENÜ · MASA BELİRSİZ';
let selected=0,quantity=1;const $=id=>document.getElementById(id);
function render(){ $('products').replaceChildren(...menu.map(([name,price,emoji],i)=>{const div=document.createElement('div');div.className='item';const e=document.createElement('div');e.className='emoji';e.textContent=emoji;const info=document.createElement('div');info.className='info';const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=price+' ₺';info.append(strong,small);const button=document.createElement('button');button.textContent=selected===i?'Seçildi':'Seç';button.setAttribute('aria-pressed',String(selected===i));button.onclick=()=>{selected=i;render()};div.append(e,info,button);return div}));$('qty').textContent=quantity;$('total').textContent=((menu[selected][1]+($('cream').checked?15:0)+($('chocolate').checked?20:0))*quantity)+' ₺'}
$('minus').onclick=()=>{quantity=Math.max(1,quantity-1);render()};$('plus').onclick=()=>{quantity++;render()};$('cream').onchange=render;$('chocolate').onchange=render;
$('order').onclick=()=>{const name=$('customer').value.trim();const box=$('message');box.style.display='block';if(!name){box.textContent='Lütfen adınızı yazın.';return}if(!table){box.textContent='Geçerli masa QR kodu gerekli. Örnek: ?table=5';return}const extras=[$('cream').checked?'Krema':null,$('chocolate').checked?'Çikolata':null].filter(Boolean).join(', ')||'Yok';box.textContent=`Sipariş özeti (DEMO)\nMüşteri: ${name}\nMasa: ${table}\nKahve: ${menu[selected][0]}\nAdet: ${quantity}\nEkstralar: ${extras}\nToplam: ${$('total').textContent}\n\nBu sürümde sipariş sunucuya gönderilmez.`};render();
</script></body></html>
